name: Keep Render API Alive

on:
  schedule:
    - cron: "*/6 * * * *"   # Every 6 minutes
  workflow_dispatch:        # Allow manual run from UI

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:

      - name: Echo current time
        run: date

      - name: Curl your Render APIs
        run: |
          curl -s https://catlog-builder-api.onrender.com/api/Category || echo "Ping failed"
          curl -s https://lipzeee-catalog-v01-backend.onrender.com/api/Category || echo "Ping failed"


